<script>
  // Tela de abertura: some depois de 2 segundos ou com um toque.
  (function () {
    var a = document.getElementById("abertura");
    function fechar() {
      if (!a) return;
      var el = a; a = null;
      el.classList.add("saindo");
      setTimeout(function () { el.remove(); }, 400);
    }
    a.addEventListener("click", fechar);
    setTimeout(fechar, 2000);
  })();
</script>
